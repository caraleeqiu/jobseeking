# 真实岗位数据源公司清单
# discover 会从这些公司的公开招聘板拉真实在招的 marketing/growth 岗位。
# 加公司：把它招聘页的 token/name 填到对应平台下即可。
#
# - Greenhouse: 看招聘页 URL 里的 board token
#     boards.greenhouse.io/<token>  →  填 <token>
# - Ashby: 看 jobs.ashbyhq.com/<name>  →  填 <name>
# （加完可跑一次 `python -c "from src import jobsource; print(len(jobsource.fetch_all()))"` 验证）

